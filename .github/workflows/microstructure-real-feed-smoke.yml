name: Microstructure Real Feed Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bounded read-only capture with access preflight
        env:
          HALE_5M_DURATION_MS: '45000'
        run: npm run microstructure:collect
      - name: Preserve evidence even when access is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microstructure-access-and-capture
          path: data/microstructure/
          if-no-files-found: error
          retention-days: 14
