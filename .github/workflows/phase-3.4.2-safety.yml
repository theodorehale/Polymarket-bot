name: Phase 3.4.2 Safety Gate

on:
  push:
    branches:
      - phase-3.4.2-single-safe-arb-path
  pull_request:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      - name: Explicit safe-path tests
        run: pnpm exec vitest run src/paper/paper-arbitrage-scanner.test.ts src/utils/executable-edge.test.ts src/utils/execution-primitives.test.ts
